syntax = "proto3";
package api;

option go_package = "github.com/dumacp/go-doors/api";

message doorState {
	int32 id = 1;
	int32 value = 2;
}
message doorsStateRequest {
	string topic = 1;
}
message doorStates {
	map<int32,doorsStateRequest> states = 1;
}

message ValuePubSubEvent {
	int32 id = 1;
    int32 state = 2;
    string coord = 3;
}

message PubSubEvent {
    ValuePubSubEvent value = 1;
    double timestamp = 2;
    string type = 3;
}
